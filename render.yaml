services:
  - type: web
    name: isles-of-hexara-server
    env: node
    plan: free
    region: oregon
    buildCommand: pnpm --filter @hexara/shared build && pnpm --filter @hexara/game-core build && pnpm --filter @hexara/protocol build && pnpm --filter @hexara/server build
    startCommand: pnpm --filter @hexara/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://islesofhexara.vercel.app,http://localhost:3000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
